# Edge-server MQTT broker (Eclipse Mosquitto, EPL-2.0/EDL-1.0).
# Receives the gateways' bridged UNS data (uns/#) and BaSyx submodel events
# (sm-repository/#), both consumed by the timescale-ingestor.
listener 1883 0.0.0.0
allow_anonymous true

# MQTT over WebSockets, for browser clients.
listener 8083 0.0.0.0
protocol websockets
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
