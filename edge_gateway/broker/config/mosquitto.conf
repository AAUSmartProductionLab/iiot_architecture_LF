# Gateway-local MQTT broker (Eclipse Mosquitto, EPL-2.0/EDL-1.0).
# Protocol adapters publish devices/<...> here; the bridge in conf.d/bridge.conf
# (written by the gateway agent on POST /api/configure) forwards it to the edge
# server under the UNS prefix.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
include_dir /mosquitto/config/conf.d
